name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:////tmp/aitinerary-ci.db
        run: python -m unittest tests.test_backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend/mobile
        run: npm ci
      - name: Typecheck
        working-directory: frontend/mobile
        run: npm run typecheck
      - name: Web export
        working-directory: frontend/mobile
        run: npx expo export --platform web --output-dir /tmp/aitinerary-web